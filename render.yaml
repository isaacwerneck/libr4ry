services:
  - type: web
    name: libr4ry-collaboration
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run collaboration
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_ORIGIN
        sync: false
      - key: COLLABORATION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
